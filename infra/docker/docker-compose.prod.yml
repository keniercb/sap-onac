# SAP-ONAC — Docker Compose para producción (on-premise Cuba)
name: sap-onac-prod

services:
  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: sap-onac-backend
    restart: always
    env_file: [../../.env.production]
    environment: { NODE_ENV: production }
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [sap-onac-prod-net]
    deploy:
      replicas: 2
      resources:
        limits: { memory: 1G, cpus: "1.0" }

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    container_name: sap-onac-frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
    depends_on: [backend]
    networks: [sap-onac-prod-net]
    deploy:
      replicas: 2
      resources:
        limits: { memory: 512M, cpus: "0.5" }

  mysql:
    image: mysql:8.0
    container_name: sap-onac-mysql
    restart: always
    env_file: [../../.env.production]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: sap_onac_prod
      MYSQL_USER: ${MYSQL_USER:-sap_onac}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ../../backups:/backups
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [sap-onac-prod-net]

  redis:
    image: redis:7-alpine
    container_name: sap-onac-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes: [redis_prod_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [sap-onac-prod-net]

  traefik:
    image: traefik:v3.1
    container_name: sap-onac-traefik
    restart: always
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports: ["80:80", "443:443", "8080:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [sap-onac-prod-net]

volumes:
  mysql_prod_data: { driver: local }
  redis_prod_data: { driver: local }
  letsencrypt: { driver: local }

networks:
  sap-onac-prod-net: { driver: bridge }
